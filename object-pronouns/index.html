:root{--ink:#15205C;--blue:#2346D8;--sun:#FFD23F;--ok:#1FAE68;--bad:#FF4F45;--line:#E3E9F7;--bg:#F3F6FD;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
body{background:var(--bg);font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh}
header{background:var(--blue);color:#fff;padding:22px 20px 26px}
.wrap{max-width:640px;margin:0 auto}
.lvl{font-weight:800;font-size:15px;background:var(--sun);color:var(--ink);display:inline-block;padding:3px 12px;border-radius:30px}
h1{font-weight:900;font-size:clamp(32px,8vw,48px);line-height:1.05;margin-top:10px}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:10px;margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sun);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin-top:8px;color:#CFE0FF}
main{padding:22px 20px 40px}
.card{background:#fff;border-radius:24px;padding:26px 22px;border:3px solid var(--line)}
.sent{font-weight:800;font-size:clamp(24px,6vw,32px);line-height:1.35;min-height:2.7em}
.gap{display:inline-block;min-width:2.8em;border-bottom:4px solid var(--blue);text-align:center;color:var(--blue)}
.gap.ok{color:var(--ok);border-color:var(--ok);min-width:0;padding:0 .1em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
button{font:inherit;cursor:pointer}
.opt{font-weight:900;font-size:26px;padding:14px 0;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{min-height:0;margin:18px 0 16px;font-weight:700;font-size:19px;line-height:1.35}
.fb b{font-weight:900}
.fb .verdict{display:block;font-weight:900;font-size:22px}.v-ok{color:var(--ok)}.v-bad{color:var(--bad)}.fb .why{display:block;margin-top:6px}.fb .ru{display:block;margin-top:10px;padding:10px 14px;background:var(--bg);border-radius:14px;font-style:normal}

.row{display:flex;gap:12px;margin-top:6px}
.btn{flex:1;font-weight:900;font-size:20px;padding:15px;border-radius:18px;border:none;background:var(--blue);color:#fff}
.btn.sec{flex:0 0 64px;background:#fff;color:var(--blue);border:3px solid var(--blue)}
.btn[hidden]{display:none}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.end{text-align:center}
.big{font-weight:900;font-size:72px;color:var(--blue);margin:8px 0}
.end p{font-weight:700;font-size:20px}
.end .btn{margin-top:22px;width:100%}
</style></head><body>

<div class="bar"><i id="bar"></i></div><div class="meta"><span id="count"></span><span id="score"></span></div></div></header>
<main class="wrap"><div class="card" id="card"></div></main>
<script>
const Q=[{"s": "This is Anna. Please help ___.", "a": "her", "subj": "she", "why": "<b>Anna</b> — это <b>she</b> → <b>her</b>. Стоит после глагола <b>help</b>.", "ru": "Это Анна. Пожалуйста, помоги ей."}, {"s": "Where's Tom? I can't see ___.", "a": "him", "subj": "he", "why": "<b>Tom</b> — это <b>he</b> → <b>him</b>. Стоит после глагола <b>see</b>.", "ru": "Где Том? Я его не вижу."}, {"s": "I love my dog. I play with ___ every day.", "a": "it", "subj": "it", "why": "<b>my dog</b> — животное, это <b>it</b>. <b>it</b> не меняется. Стоит после предлога <b>with</b>.", "ru": "Я люблю свою собаку. Я играю с ней каждый день."}, {"s": "My friends are here. Let's play with ___.", "a": "them", "subj": "they", "why": "<b>my friends</b> — это <b>they</b> → <b>them</b>. Стоит после предлога <b>with</b>.", "ru": "Мои друзья здесь. Давай поиграем с ними."}, {"s": "I'm hungry! Give ___ an apple, please.", "a": "me", "subj": "I", "why": "Говорю о себе — <b>I</b> → <b>me</b>. Стоит после глагола <b>give</b>.", "ru": "Я голодный! Дай мне яблоко, пожалуйста."}, {"s": "We're lost! Can you help ___?", "a": "us", "subj": "we", "why": "Говорим о себе — <b>we</b> → <b>us</b>. Стоит после глагола <b>help</b>.", "ru": "Мы потерялись! Ты можешь нам помочь?"}, {"s": "Where are my books? I can't find ___.", "a": "them", "subj": "they", "why": "<b>my books</b> — это <b>they</b> → <b>them</b>. Стоит после глагола <b>find</b>.", "ru": "Где мои книги? Я не могу их найти."}, {"s": "Grandma is at home. Let's call ___.", "a": "her", "subj": "she", "why": "<b>Grandma</b> — это <b>she</b> → <b>her</b>. Стоит после глагола <b>call</b>.", "ru": "Бабушка дома. Давай ей позвоним."}, {"s": "This is my new ball. Look at ___!", "a": "it", "subj": "it", "why": "<b>my new ball</b> — предмет, это <b>it</b>. <b>it</b> не меняется. Стоит после предлога <b>at</b>.", "ru": "Это мой новый мяч. Посмотри на него!"}, {"s": "Sam, come here! I can't hear ___.", "a": "you", "subj": "you", "why": "Обращаемся к Сэму — <b>you</b>. <b>you</b> не меняется. Стоит после глагола <b>hear</b>.", "ru": "Сэм, иди сюда! Я тебя не слышу."}, {"s": "Mr Brown is our teacher. We like ___.", "a": "him", "subj": "he", "why": "<b>Mr Brown</b> — это <b>he</b> → <b>him</b>. Стоит после глагола <b>like</b>.", "ru": "Мистер Браун — наш учитель. Он нам нравится."}, {"s": "Wait for ___! I'm coming!", "a": "me", "subj": "I", "why": "Говорю о себе — <b>I</b> → <b>me</b>. Стоит после предлога <b>for</b>.", "ru": "Подожди меня! Я иду!"}, {"s": "Lucy and I are in the park. Come with ___!", "a": "us", "subj": "we", "why": "<b>Lucy and I</b> — это <b>we</b> → <b>us</b>. Стоит после предлога <b>with</b>.", "ru": "Мы с Люси в парке. Пойдём с нами!"}, {"s": "Ben and Mia are nice. I like ___.", "a": "them", "subj": "they", "why": "<b>Ben and Mia</b> — это <b>they</b> → <b>them</b>. Стоит после глагола <b>like</b>.", "ru": "Бен и Миа хорошие. Они мне нравятся."}];
const ALL=["me","you","him","her","it","us","them"];
let order=[],i=0,score=0,wrong=[];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:"en-GB";if(voice)u.voice=voice;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function start(){order=shuffle(Q);i=0;score=0;show()}
function head(){$("bar").style.width=(i/order.length*100)+"%";$("count").textContent=Math.min(i+1,order.length)+" / "+order.length;$("score").textContent="✓ "+score}
function show(){head();const q=order[i];
 const wrongs=new Set([q.subj==q.a?null:q.subj]);
 shuffle(ALL.filter(x=>x!==q.a)).forEach(x=>{if(wrongs.size<4&&x!==q.subj)wrongs.add(x)});
 wrongs.delete(null);
 let pool=[...wrongs].slice(0,3);
 if(q.subj!==q.a&&!pool.includes(q.subj))pool[0]=q.subj;
 const opts=shuffle([q.a,...pool]);
 $("card").innerHTML='<p class="sent">'+q.s.replace("___",'<span class="gap" id="gap">&nbsp;</span>')+'</p><div class="opts">'+opts.map(o=>'<button class="opt">'+o+'</button>').join("")+'</div><p class="fb" id="fb" aria-live="polite"></p><div class="row"><button class="btn sec" id="spk" hidden aria-label="Послушать">🔊</button><button class="btn" id="next" hidden>Дальше</button></div>';
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q));
}
function answer(btn,q){const full=q.s.replace("___",q.a);
 document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add("ok")});
 $("gap").textContent=q.a;$("gap").classList.add("ok");
 const ok=btn.textContent===q.a;if(ok)score++;else btn.classList.add("bad");
 $("fb").innerHTML='<span class="verdict '+(ok?"v-ok":"v-bad")+'">'+(ok?"Верно!":"Правильно: "+q.a)+'</span><span class="why">'+q.why+'</span><span class="ru">'+q.ru+'</span>';
 head();say(full);
 $("spk").hidden=false;$("spk").onclick=()=>say(full);
 const n=$("next");n.hidden=false;n.textContent=i===order.length-1?"Результат":"Дальше";n.onclick=()=>{i++;i<order.length?show():end()};n.focus();
}
function end(){$("bar").style.width="100%";$("count").textContent=order.length+" / "+order.length;$("score").textContent="✓ "+score;
 const msg=score===order.length?"Отлично! Без ошибок!":score>=order.length*.7?"Хорошо! Ещё раз — и будет идеально.":"Посмотри шпаргалку и попробуй ещё раз.";
 $("card").innerHTML='<div class="end"><p>Твой результат</p><div class="big">'+score+' / '+order.length+'</div><p>'+msg+'</p><button class="btn" id="again">Ещё раз</button></div>';
 $("again").onclick=start;$("again").focus()}
start();
</script></body></html>
